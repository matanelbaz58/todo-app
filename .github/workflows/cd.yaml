name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/todo-app-local:${{ env.IMAGE_TAG }}

      - name: Update Manifests Repo
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          git clone https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/todo-manifests.git
          cd todo-manifests
          sed -i "s|image: .*/todo-app-local:.*|image: ${DOCKER_USERNAME}/todo-app-local:${IMAGE_TAG}|g" deployment.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "chore: update image tag to ${IMAGE_TAG}"
          git push
